name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/${{ steps.repo.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM CycloneDX and SPDX
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p evidence/sbom
          syft "$IMAGE" -o cyclonedx-json=evidence/sbom/sbom.cdx.json -o spdx-json=evidence/sbom/sbom.spdx.json

      - name: CycloneDX analyze evidence
        run: ./scripts/cyclonedx_analyze.sh evidence/sbom/sbom.cdx.json evidence/cyclonedx-analyze.log

      - name: Validate license allowlist
        run: python scripts/valida_licencas_sbom.py evidence/sbom/sbom.cdx.json

      - name: Dependency-Track mock submission
        env:
          DT_PROJECT_VERSION: ${{ github.ref_name }}
        run: python scripts/consulta_dt.py evidence/sbom/sbom.cdx.json | tee evidence/dependency-track.log

      - name: Grype vulnerability scan
        run: |
          grype sbom:evidence/sbom/sbom.cdx.json -o json > evidence/grype-report.json
          grype sbom:evidence/sbom/sbom.cdx.json --fail-on critical -o table

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image keyless
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ steps.repo.outputs.name }}@$DIGEST"

      - name: Attach CycloneDX SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate evidence/sbom/sbom.cdx.json \
            --type https://cyclonedx.org/bom \
            "ghcr.io/${{ steps.repo.outputs.name }}@$DIGEST"

      - name: Attach vulnerability scan attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate evidence/grype-report.json \
            --type vuln \
            "ghcr.io/${{ steps.repo.outputs.name }}@$DIGEST"

      - name: Verify signature in pipeline
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "ghcr.io/${{ steps.repo.outputs.name }}@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.*" \
            | tee evidence/cosign-verify.json

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: evidence/

      - name: Create GitHub release with evidence
        uses: softprops/action-gh-release@v2
        with:
          files: |
            evidence/sbom/sbom.cdx.json
            evidence/sbom/sbom.spdx.json
            evidence/grype-report.json
            evidence/dependency-track.log
            evidence/cyclonedx-analyze.log
            evidence/cosign-verify.json

  generate-provenance:
    needs: build-sign-attest
    permissions:
      actions: read
      id-token: write
      contents: read
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-sign-attest.outputs.image }}
      digest: ${{ needs.build-sign-attest.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}